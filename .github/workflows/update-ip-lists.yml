name: Update IP lists

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ip-lists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build address-list VPN
        id: build
        continue-on-error: true
        run: python3 scripts/update_ip_lists.py

      - name: Commit changes
        run: |
          git add lists/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update IP lists ($(date -u +%Y-%m-%d))"
          git push

      - name: Fail if a source could not be updated
        if: steps.build.outcome == 'failure'
        run: |
          echo "Some sources failed; their previous lists were kept. See the build step log."
          exit 1
